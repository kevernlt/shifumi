<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifumi</title>
    <link rel="stylesheet" href="style/style.css">
    <script src="script/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Shifumi</h1>
    </header>
    <main>
        <button class="btn-jeu" aria-label="Jouer la pierre">Pierre</button>
        <button class="btn-jeu" aria-label="Jouer la feuille">Feuille</button>
        <button class="btn-jeu" aria-label="Jouer les ciseaux">Ciseaux</button>
    </main>
    <div>
        <p>Victoires : <span id="win">0</span></p>
        <p>Défaites : <span id="lose">0</span></p>
        <p>Nuls : <span id="draw">0</span></p>
        <p>Total : <span id="total">0</span></p>
        <button id="reset" aria-label="Réinitialiser le score">Réinitialiser le score</button>
    </div>
    <footer>
        <p>Ernault Kévin (le-mulet)</p>
    </footer>
</body>
</html>
